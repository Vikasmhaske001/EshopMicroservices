<div class="row">
  <div class="product">
    <span class="thumb">
      <app-product-image [category]="category()" [imageFile]="imageFile()" />
    </span>
    <span class="product-text">
      <span class="name">{{ item().productName }}</span>
      @if (category()) {
        <span class="eyebrow">{{ category() }}</span>
      }
    </span>
  </div>

  <div class="unit">
    <span>{{ item().effectivePrice | inr }}</span>
    @if (item().discountAmount > 0) {
      <span class="saving">Save {{ item().discountAmount | inr }} each</span>
    }
  </div>

  <app-quantity-stepper
    class="qty"
    [value]="item().quantity"
    [label]="'Quantity of ' + item().productName"
    (valueChange)="quantityChange.emit($event)"
  />

  <span class="line-total">{{ item().effectivePrice * item().quantity | inr }}</span>

  <button type="button" class="remove" [attr.aria-label]="'Remove ' + item().productName" (click)="remove.emit()">
    &times;
  </button>
</div>
