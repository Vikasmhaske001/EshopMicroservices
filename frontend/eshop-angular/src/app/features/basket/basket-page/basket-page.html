<h2>Your Basket</h2>

@if (loading()) {
  <mat-progress-bar mode="indeterminate" />
} @else if (basketService.cart(); as cart) {
  @if (cart.items.length > 0) {
    <div class="basket-items">
      @for (item of cart.items; track item.productId) {
        <app-basket-item
          [item]="item"
          (quantityChange)="onQuantityChange(item.productId, $event)"
          (remove)="onRemove(item.productId)"
        />
      }
    </div>

    <div class="basket-summary">
      <span>Total</span>
      <span class="total-value">{{ cart.totalPrice | currency }}</span>
    </div>

    <div class="basket-actions">
      <button mat-button type="button" (click)="onClear()">Clear basket</button>
      <a mat-button routerLink="/products">Continue shopping</a>
      <a mat-flat-button routerLink="/checkout">Proceed to Checkout</a>
    </div>
  } @else {
    <p class="empty-state">Your basket is empty.</p>
    <a mat-flat-button routerLink="/products">Browse products</a>
  }
}
