<article class="card">
  <a class="media" [routerLink]="['/products', product().id]" tabindex="-1" aria-hidden="true">
    <app-product-image [category]="category()" [imageFile]="product().imageFile" />
  </a>

  <div class="body">
    <p class="eyebrow">{{ category() }}</p>
    <h3 class="name">
      <a [routerLink]="['/products', product().id]">{{ product().name }}</a>
    </h3>

    <div class="buy">
      <span class="price">{{ product().price | inr }}</span>

      @if (inBasket() > 0) {
        <button
          type="button"
          class="in-basket"
          [disabled]="adding()"
          [attr.aria-label]="'In basket, ' + inBasket() + '. Add one more ' + product().name"
          (click)="add.emit(product())"
        >
          &#10003; In basket &middot; {{ inBasket() }}
        </button>
      } @else {
        <button
          type="button"
          class="es-btn es-btn--sm"
          [disabled]="adding()"
          [attr.aria-label]="'Add ' + product().name + ' to basket'"
          (click)="add.emit(product())"
        >
          Add
        </button>
      }
    </div>
  </div>
</article>
