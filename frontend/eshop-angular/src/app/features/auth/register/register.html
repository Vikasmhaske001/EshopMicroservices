<app-auth-shell
  headline="Join EShop."
  blurb="Create an account to save your basket, check out faster and track every order."
>
  <header>
    <h1>Create account</h1>
    <p>It only takes a minute.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <app-field label="Username" [control]="form.controls.userName">
      <input esInput class="es-input--tall" formControlName="userName" autocomplete="username" />
    </app-field>

    <app-field label="Email" [control]="form.controls.email">
      <input esInput class="es-input--tall" type="email" formControlName="email" autocomplete="email" />
    </app-field>

    <app-field label="Password" hint="6+ characters, with a letter and a number." [control]="form.controls.password">
      <span class="password-wrap">
        <input
          esInput
          class="es-input--tall"
          formControlName="password"
          autocomplete="new-password"
          [type]="showPassword() ? 'text' : 'password'"
        />
        <button
          type="button"
          class="toggle"
          [attr.aria-pressed]="showPassword()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          (click)="showPassword.set(!showPassword())"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </span>
    </app-field>

    @if (errorMessage(); as message) {
      <app-error-banner [message]="message" />
    }

    <button type="submit" class="es-btn submit" [disabled]="submitting()">
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>
  </form>

  <p class="switch">
    Already have an account?
    <a routerLink="/login" [queryParams]="returnUrl ? { returnUrl } : {}">Sign in</a>
  </p>
</app-auth-shell>
