<div class="auth-card">
  <h2>Create an account</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline">
      <mat-label>Username</mat-label>
      <input matInput formControlName="userName" autocomplete="username" />
      <mat-error appFieldError [control]="form.controls.userName" label="Username" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email" />
      <mat-error appFieldError [control]="form.controls.email" label="Email" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="new-password" />
      <mat-hint>6+ characters, with a letter and a number.</mat-hint>
      <mat-error appFieldError [control]="form.controls.password" label="Password" />
    </mat-form-field>

    @if (errorMessage(); as message) {
      <app-error-banner [message]="message" />
    }

    <button mat-flat-button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Creating account...' : 'Register' }}
    </button>
  </form>

  <p>
    Already have an account?
    <a routerLink="/login" [queryParams]="returnUrl ? { returnUrl } : {}">Sign in</a>
  </p>
</div>
