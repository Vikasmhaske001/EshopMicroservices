<app-auth-shell
  headline="Your basket is waiting."
  blurb="Sign in to add items, check out and track every order in one place."
>
  <header>
    <h1>Sign in</h1>
    <p>Welcome back to EShop.</p>
  </header>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <app-field label="Username" [control]="form.controls.userName">
      <input esInput class="es-input--tall" formControlName="userName" autocomplete="username" />
    </app-field>

    <app-field label="Password" [control]="form.controls.password">
      <span class="password-wrap">
        <input
          esInput
          class="es-input--tall"
          formControlName="password"
          autocomplete="current-password"
          [type]="showPassword() ? 'text' : 'password'"
        />
        <button
          type="button"
          class="toggle"
          [attr.aria-pressed]="showPassword()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          (click)="showPassword.set(!showPassword())"
        >
          {{ showPassword() ? 'Hide' : 'Show' }}
        </button>
      </span>
    </app-field>

    @if (errorMessage(); as message) {
      <app-error-banner [message]="message" />
    }

    <button type="submit" class="es-btn submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="switch">
    Don't have an account?
    <a routerLink="/register" [queryParams]="returnUrl ? { returnUrl } : {}">Register</a>
  </p>
</app-auth-shell>
