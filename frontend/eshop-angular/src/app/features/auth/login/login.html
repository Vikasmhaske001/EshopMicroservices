<div class="auth-card">
  <h2>Sign in</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <mat-form-field appearance="outline">
      <mat-label>Username</mat-label>
      <input matInput formControlName="userName" autocomplete="username" />
      <mat-error appFieldError [control]="form.controls.userName" label="Username" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password" />
      <mat-error appFieldError [control]="form.controls.password" label="Password" />
    </mat-form-field>

    @if (errorMessage(); as message) {
      <app-error-banner [message]="message" />
    }

    <button mat-flat-button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in...' : 'Sign in' }}
    </button>
  </form>

  <p>
    Don't have an account?
    <a routerLink="/register" [queryParams]="returnUrl ? { returnUrl } : {}">Register</a>
  </p>
</div>
