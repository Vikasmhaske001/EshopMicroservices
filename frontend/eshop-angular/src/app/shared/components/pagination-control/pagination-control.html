<nav class="pagination" aria-label="Pagination">
  <button
    type="button"
    class="page arrow"
    [disabled]="pageIndex() <= 1"
    (click)="previous()"
    aria-label="Previous page"
  >
    &#8249;
  </button>

  @for (item of pages(); track $index) {
    @if (item === 'gap') {
      <span class="gap" aria-hidden="true">&hellip;</span>
    } @else {
      <button
        type="button"
        class="page"
        [class.current]="item === pageIndex()"
        [attr.aria-current]="item === pageIndex() ? 'page' : null"
        [attr.aria-label]="'Page ' + item"
        (click)="goTo(item)"
      >
        {{ item }}
      </button>
    }
  }

  <button
    type="button"
    class="page arrow"
    [disabled]="pageIndex() >= totalPages()"
    (click)="next()"
    aria-label="Next page"
  >
    &#8250;
  </button>
</nav>
