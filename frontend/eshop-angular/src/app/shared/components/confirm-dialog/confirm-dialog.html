<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button type="button" class="es-btn-outline cancel" (click)="cancel()">{{ data.cancelLabel ?? 'Cancel' }}</button>
  <button type="button" class="es-btn es-btn--sm confirm" [class.es-btn--danger]="data.destructive" (click)="confirm()">
    {{ data.confirmLabel ?? 'Confirm' }}
  </button>
</mat-dialog-actions>
