<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isA }}"><div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:22px 56px;border-bottom:1px solid #e9e1d0;background:#faf7f0;font-family:Geist,sans-serif;color:#1d1230">
<nav style="display:flex;gap:28px;font-size:14px"><a href="#" style="color:#1d1230;text-decoration:underline;text-decoration-color:#ffb703;text-decoration-thickness:2px;text-underline-offset:7px">Shop</a><sc-if value="{{ signedIn }}"><a href="#" style="color:#5e576b">My orders</a></sc-if></nav>
<div style="font:500 30px Newsreader,serif;letter-spacing:-.01em">EShop<span style="color:#ffb703">.</span></div>
<div style="display:flex;gap:24px;justify-content:flex-end;align-items:center;font-size:14px;color:#5e576b">
<input value="{{ search }}" onChange="{{ onSearch }}" placeholder="Search" aria-label="Search products" style="width:170px;border:0;border-bottom:1px solid #cfc5b2;background:transparent;padding:6px 0;font-size:14px;color:#1d1230;outline:none" style-focus="border-bottom-color:#1d1230">
<sc-if value="{{ signedIn }}"><div style="display:flex;gap:24px"><a href="#" style="color:#5e576b">Account</a><a href="#" style="color:#1d1230">Basket ({{ count }})</a></div></sc-if>
<sc-if value="{{ signedOut }}"><div style="display:flex;gap:24px"><a href="#" style="color:#1d1230">Sign in</a><a href="#" style="color:#5e576b">Register</a></div></sc-if>
</div></div></sc-if>
<sc-if value="{{ isB }}"><div style="display:flex;align-items:center;gap:28px;padding:16px 48px;background:#1d1230;color:#fff;font-family:'Bricolage Grotesque',sans-serif">
<div style="font-size:30px;font-weight:800;letter-spacing:-.04em">eshop<span style="color:#ffb703">*</span></div>
<nav style="display:flex;gap:6px;font-size:15px;font-weight:600"><a href="#" style="color:#1d1230;background:#ffb703;padding:8px 16px;border-radius:99px;text-decoration:none">Shop</a><sc-if value="{{ signedIn }}"><a href="#" style="color:#fff;padding:8px 16px;border-radius:99px;text-decoration:none" style-hover="background:#33264a">Orders</a></sc-if></nav>
<input value="{{ search }}" onChange="{{ onSearch }}" placeholder="Search products" aria-label="Search products" style="flex:1;max-width:440px;margin-left:auto;height:44px;border-radius:99px;border:0;background:#33264a;color:#fff;padding:0 20px;font-size:15px;outline:none" style-focus="box-shadow:0 0 0 2px #ffb703">
<sc-if value="{{ signedIn }}"><div style="display:flex;align-items:center;gap:12px"><a href="#" style="background:#ffb703;color:#1d1230;padding:10px 18px;border-radius:99px;font-weight:700;font-size:15px;text-decoration:none">Bag · {{ count }}</a><div style="width:40px;height:40px;border-radius:50%;background:#4b2a99;border:2px solid #ffb703;box-sizing:border-box;display:grid;place-items:center;font-weight:700">V</div></div></sc-if>
<sc-if value="{{ signedOut }}"><div style="display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px"><a href="#" style="color:#fff;padding:10px 14px">Log in</a><a href="#" style="background:#ffb703;color:#1d1230;padding:10px 18px;border-radius:99px;text-decoration:none">Join</a></div></sc-if>
</div></sc-if>
<sc-if value="{{ isC }}"><div style="background:#fff;border-bottom:1px solid #e4e1ea;font-family:'IBM Plex Sans',sans-serif;color:#1d1230">
<div style="display:flex;align-items:center;gap:28px;padding:14px 32px">
<div style="display:flex;align-items:center;gap:10px"><div style="width:34px;height:34px;border-radius:8px;background:#4b2a99;color:#ffb703;display:grid;place-items:center;font-weight:700">E</div><span style="font-size:20px;font-weight:700">EShop</span></div>
<div style="flex:1;max-width:760px;display:flex"><input value="{{ search }}" onChange="{{ onSearch }}" placeholder="Search by product name" aria-label="Search products" style="flex:1;height:44px;border:1.5px solid #cbc6d6;border-right:0;border-radius:6px 0 0 6px;padding:0 16px;font-size:15px;outline:none" style-focus="border-color:#4b2a99"><button style="height:44px;padding:0 22px;border:0;border-radius:0 6px 6px 0;background:#4b2a99;color:#fff;font-weight:600;font-size:15px">Search</button></div>
<sc-if value="{{ signedIn }}"><div style="margin-left:auto;display:flex;gap:22px;align-items:center;font-size:14px"><a href="#" style="color:#1d1230;display:flex;flex-direction:column;line-height:1.2"><span style="font-size:12px;color:#57506a">Hello, Vikas</span><span style="font-weight:600">Account</span></a><a href="#" style="color:#1d1230;font-weight:600">Orders</a><a href="#" style="display:flex;align-items:center;gap:8px;color:#1d1230;font-weight:600;text-decoration:none"><span style="min-width:24px;height:24px;padding:0 6px;box-sizing:border-box;border-radius:6px;background:#ffb703;color:#1d1230;display:grid;place-items:center;font-size:13px;font-weight:700">{{ count }}</span>Basket</a></div></sc-if>
<sc-if value="{{ signedOut }}"><div style="margin-left:auto;display:flex;gap:16px;align-items:center;font-size:14px;font-weight:600"><a href="#" style="color:#1d1230">Sign in</a><a href="#" style="color:#4b2a99">Create account</a></div></sc-if>
</div>
<nav style="display:flex;gap:4px;padding:0 32px;background:#faf9fc;border-top:1px solid #efedf3;font-size:14px"><sc-for list="{{ cats }}" as="c" hint-placeholder-count="5"><sc-if value="{{ c.active }}"><button onClick="{{ c.onClick }}" style="padding:11px 14px;border:0;background:transparent;color:#4b2a99;font-weight:600;box-shadow:inset 0 -3px 0 #ffb703">{{ c.label }}</button></sc-if><sc-if value="{{ c.inactive }}"><button onClick="{{ c.onClick }}" style="padding:11px 14px;border:0;background:transparent;color:#3d3550" style-hover="color:#1d1230">{{ c.label }}</button></sc-if></sc-for></nav>
</div></sc-if>
<sc-if value="{{ isD }}"><div style="display:flex;align-items:center;gap:28px;padding:0 48px;height:76px;background:#fff;border-bottom:1px solid #f0e8d8;font-family:'Plus Jakarta Sans',sans-serif;color:#1d1230">
<div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border-radius:10px;background:#4b2a99;color:#ffb703;font-weight:800;display:grid;place-items:center;font-size:18px">E</div><span style="font-size:22px;font-weight:800;letter-spacing:-.02em">EShop</span></div>
<nav style="display:flex;gap:4px;font-size:15px;font-weight:600"><a href="#" style="padding:8px 14px;border-radius:10px;background:#f1ecff;color:#4b2a99;text-decoration:none">Shop</a><sc-if value="{{ signedIn }}"><a href="#" style="padding:8px 14px;border-radius:10px;color:#57506a;text-decoration:none" style-hover="background:#faf6ee;color:#1d1230">My orders</a></sc-if></nav>
<label style="margin-left:auto;display:flex;align-items:center;gap:12px;width:380px;height:44px;padding:0 14px;box-sizing:border-box;border:1px solid #ebe2d0;border-radius:12px;background:#fffcf6"><div style="width:11px;height:11px;border:2px solid #8a8296;border-radius:50%;position:relative;flex:none"><div style="position:absolute;width:6px;height:2px;background:#8a8296;right:-6px;bottom:-3px;transform:rotate(45deg)"></div></div><input value="{{ search }}" onChange="{{ onSearch }}" placeholder="Search products" aria-label="Search products" style="flex:1;border:0;background:transparent;outline:none;font-size:15px;color:#1d1230"></label>
<sc-if value="{{ signedIn }}"><div style="display:flex;align-items:center;gap:16px"><a href="#" aria-label="Basket, {{ count }} items" style="position:relative;width:44px;height:44px;border:1px solid #ebe2d0;border-radius:12px;display:grid;place-items:center" style-hover="background:#fff4dc;border-color:#ffd166"><div style="position:relative;width:16px;height:13px;border:2px solid #1d1230;border-radius:3px;margin-top:5px"><div style="position:absolute;left:3px;top:-8px;width:6px;height:6px;border:2px solid #1d1230;border-bottom:0;border-radius:6px 6px 0 0"></div></div><sc-if value="{{ hasCount }}"><span style="position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;box-sizing:border-box;border-radius:99px;background:#ffb703;color:#1d1230;font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid #fff">{{ count }}</span></sc-if></a><div style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600"><div style="width:36px;height:36px;border-radius:50%;background:#4b2a99;color:#fff;display:grid;place-items:center">V</div>Vikas</div></div></sc-if>
<sc-if value="{{ signedOut }}"><div style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600"><a href="#" style="color:#1d1230;padding:10px 14px">Log in</a><a href="#" style="background:#ffb703;color:#1d1230;padding:12px 18px;border-radius:12px;text-decoration:none">Create account</a></div></sc-if>
</div></sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:130},&quot;concept&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;a&quot;,&quot;b&quot;,&quot;c&quot;,&quot;d&quot;],&quot;default&quot;:&quot;d&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;signedIn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;search&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onSearch&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(e)=&gt;void&quot;},&quot;cats&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;array&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const c = this.props.concept ?? 'd';
    const signedIn = this.props.signedIn ?? true;
    const count = this.props.count ?? 0;
    return { isA: c === 'a', isB: c === 'b', isC: c === 'c', isD: c === 'd', signedIn, signedOut: !signedIn, count, hasCount: count > 0, cats: this.props.cats ?? [] };
  }
}
</script>
</body>
</html>
